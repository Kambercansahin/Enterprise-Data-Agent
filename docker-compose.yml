version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_db}
    ports:
      - ${POSTGRES_PORTS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agent_network

  redis:
    image: redis:7-alpine
    container_name: agent_redis
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    networks:
      - agent_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent_qdrant
    restart: always
    ports:
      - ${QDRANT_PORTS}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agent_network

  fast_api:
    build: .
    image: kambercansahin/fast_api:v1

    container_name: enterprise_data_agent
    restart: always
    env_file:
      - .env
      - src/graphs/.env
    networks:
      - agent_network
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  agent_network:
    driver: bridge