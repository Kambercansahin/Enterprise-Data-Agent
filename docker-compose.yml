version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: enterprise_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agent_network

  redis:
    image: redis:7-alpine
    container_name: agent_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agent_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agent_network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  agent_network:
    driver: bridge